<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <!-- added code: mobile viewport meta tag -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Lobby - Real-Time Old Maid</title>
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        body,
        button,
        h2,
        h3 {
            font-family: 'Silkscreen', monospace;
        }
    </style>
</head>

<body class="landing-page-body">
    <!-- added code: responsive themed lobby card -->
    <div id="lobbyScreen" class="lobby-card">
        <h2 class="lobby-title">Room Code: <span id="displayRoomCode" class="lobby-code-badge">----</span></h2>
        <div class="lobby-subtitle">Players in Lobby:</div>
        <ul id="playerList" class="lobby-player-list"></ul>
        <button id="startGameBtn" class="landing-btn-primary" style="display: none;" onclick="triggerStartGame()">Start Game</button>
    </div>

    <!-- added code: leave party button -->
    <button id="leavePartyBtn" class="leave-party-btn" onclick="leaveParty()">Leave Party</button>

    <script src="/socket.io/socket.io.js"></script>
    <script src="lobby.js"></script>
</body>

</html>
