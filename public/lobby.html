<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Lobby - Real-Time Old Maid</title>
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        body,
        button,
        h3 {
            font-family: 'Silkscreen', monospace;
        }
    </style>
</head>

<body>
    <div id="lobbyScreen" style="text-align: center; margin: 40px auto;">
        <h2>Room Code: <span id="displayRoomCode" style="color: #007bff;">----</span></h2>
        <h3>Players in Lobby:</h3>
        <ul id="playerList" style="list-style: none; padding: 0;"></ul>
        <button id="startGameBtn" style="display: none;" onclick="triggerStartGame()">Start Game</button>
    </div>

    <!-- added code: leave party button -->
    <button id="leavePartyBtn" class="leave-party-btn" onclick="leaveParty()">Leave Party</button>

    <script src="/socket.io/socket.io.js"></script>
    <script src="lobby.js"></script>
</body>

</html>
